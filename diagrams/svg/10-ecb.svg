@startuml
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam shadowing false
skinparam ArrowColor #1E4E8C
skinparam ArrowFontColor #33414E
skinparam classBackgroundColor #F3F6FA
skinparam classBorderColor #1E4E8C
skinparam classHeaderBackgroundColor #E3ECF7
skinparam stereotypeCBackgroundColor #D9822B
skinparam stereotypeIBackgroundColor #6B9BD1
skinparam stereotypeEBackgroundColor #E8B04B
skinparam packageBorderColor #8A97A6
skinparam packageBackgroundColor #FFFFFF
skinparam componentBackgroundColor #F3F6FA
skinparam componentBorderColor #1E4E8C
skinparam interfaceBackgroundColor #FFFFFF
skinparam interfaceBorderColor #1E4E8C
skinparam databaseBackgroundColor #FBEBD9
skinparam databaseBorderColor #B5651D
skinparam nodeBackgroundColor #FFFFFF
skinparam nodeBorderColor #8A97A6
skinparam rectangleBorderColor #1E4E8C
skinparam cloudBackgroundColor #FFFFFF
skinparam cloudBorderColor #8A97A6
skinparam actorBorderColor #1E4E8C
skinparam actorBackgroundColor #E3ECF7
skinparam noteBackgroundColor #FFF6E5
skinparam noteBorderColor #D9822B
skinparam sequenceLifeLineBorderColor #8A97A6
skinparam sequenceParticipantBackgroundColor #F3F6FA
skinparam sequenceParticipantBorderColor #1E4E8C
skinparam sequenceGroupBorderColor #8A97A6
skinparam entityBackgroundColor #F3F6FA
skinparam entityBorderColor #1E4E8C
skinparam boundaryBackgroundColor #F3F6FA
skinparam boundaryBorderColor #1E4E8C
skinparam controlBackgroundColor #F3F6FA
skinparam controlBorderColor #1E4E8C
left to right direction
actor Supervisor
boundary "AllocationBoardView" as B1
boundary "AllocationController\n(REST endpoint)" as B2
control "AllocateJob\n(AllocationService)" as C1
control "AutoAllocate\n(AllocationService)" as C2
entity "Job" as E1
entity "Worker" as E2
entity "Allocation" as E3
Supervisor - - B1
B1 - -> B2 : HTTPS/JSON
B2 - -> C1
B2 - -> C2
C1 - -> E2
C1 - -> E1
C2 - -> E2
E2 - -> E3 : creates
E3 - -> E1
@enduml

